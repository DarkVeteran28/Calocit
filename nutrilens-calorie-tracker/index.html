<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>NutriLens — Calorie Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js" defer></script>
  <style>
    :root {
      --color-bg: #0a0a0a;
      --color-surface: #111111;
      --color-surface-elevated: #1a1a1a;
      --color-border: #262626;
      --color-text: #fafafa;
      --color-text-muted: #a3a3a3;
      --color-text-subtle: #737373;
      --color-accent: #4ade80;
      --color-accent-dim: rgba(74, 222, 128, 0.15);
      --color-accent-hover: #22c55e;
      --color-danger: #f87171;
      --color-protein: #60a5fa;
      --color-carbs: #fbbf24;
      --color-fat: #fb7185;
      --ring-circumference: 427.3;
      --font-display: "Syne", system-ui, sans-serif;
      --font-body: "DM Sans", system-ui, sans-serif;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;
      --max-width: 390px;
      --nav-height: 96px;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.5;
      color: var(--color-text);
      background: var(--color-bg);
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      width: 100%;
      max-width: var(--max-width);
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }

    /* Navigation */
    .nav {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: var(--space-sm) var(--space-md) 0;
      padding-top: calc(var(--space-sm) + env(safe-area-inset-top, 0));
      background: rgba(10, 10, 10, 0.72);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--color-border);
    }

    .nav-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-sm);
    }

    .logo {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
      color: var(--color-text);
    }

    .logo span {
      color: var(--color-accent);
    }

    .streak-badge {
      display: inline-flex;
      align-items: center;
      gap: var(--space-xs);
      padding: var(--space-xs) var(--space-sm);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.8125rem;
      color: var(--color-accent);
      background: var(--color-accent-dim);
      border-radius: 999px;
      border: 1px solid rgba(74, 222, 128, 0.25);
    }

    .nav-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-xs);
      padding-bottom: var(--space-sm);
    }

    .nav-tab {
      padding: var(--space-sm) var(--space-xs);
      border: none;
      border-radius: var(--radius-sm);
      background: transparent;
      font-family: var(--font-body);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--color-text-muted);
      cursor: pointer;
      transition: color 0.15s ease, background 0.15s ease;
    }

    .nav-tab:hover {
      color: var(--color-text);
    }

    .nav-tab.active {
      color: var(--color-accent);
      background: var(--color-accent-dim);
    }

    /* Pages */
    .page {
      display: none;
      flex: 1;
      flex-direction: column;
      gap: var(--space-md);
      padding: var(--space-md);
      padding-bottom: calc(var(--space-lg) + env(safe-area-inset-bottom, 0));
    }

    .page.active {
      display: flex;
      animation: fadeUp 0.3s ease;
    }

    #page-home {
      gap: var(--space-md);
      padding-bottom: var(--space-lg);
    }

    /* Home hero */
    .hero {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--space-lg) var(--space-md);
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .hero__date {
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--color-text-subtle);
    }

    .hero__greeting {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.375rem;
      line-height: 1.2;
      letter-spacing: -0.02em;
      color: var(--color-text);
      margin-top: calc(var(--space-xs) * -1);
    }

    .hero__ring-wrap {
      display: flex;
      justify-content: center;
      padding: var(--space-sm) 0;
    }

    .cal-ring {
      width: 170px;
      height: 170px;
      display: block;
    }

    .cal-ring__progress {
      transition: stroke-dashoffset 0.6s ease;
    }

    .cal-ring__center-value {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.75rem;
      fill: var(--color-text);
    }

    .cal-ring__center-label {
      font-family: var(--font-body);
      font-size: 0.6875rem;
      fill: var(--color-text-muted);
    }

    .macro-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-sm);
    }

    .macro-card {
      background: var(--color-surface-elevated);
      border-radius: var(--radius-md);
      padding: var(--space-sm);
      display: flex;
      flex-direction: column;
      gap: var(--space-xs);
    }

    .macro-card__label {
      font-size: 0.625rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .macro-card__label--protein { color: var(--color-protein); }
    .macro-card__label--carbs { color: var(--color-carbs); }
    .macro-card__label--fat { color: var(--color-fat); }

    .macro-card__value {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.9375rem;
      color: var(--color-text);
    }

    .macro-card__value span {
      font-family: var(--font-body);
      font-size: 0.6875rem;
      font-weight: 500;
      color: var(--color-text-subtle);
    }

    .macro-card__bar {
      height: 3px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      overflow: hidden;
    }

    .macro-card__bar-fill {
      height: 100%;
      border-radius: 999px;
      width: 0%;
      transition: width 0.5s ease;
    }

    .macro-card__bar-fill--protein { background: var(--color-protein); }
    .macro-card__bar-fill--carbs { background: var(--color-carbs); }
    .macro-card__bar-fill--fat { background: var(--color-fat); }

    /* Scan CTA */
    .scan-cta {
      width: 100%;
      padding: var(--space-md);
      border: none;
      border-radius: var(--radius-md);
      background: var(--color-accent);
      color: var(--color-bg);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.9375rem;
      letter-spacing: 0.01em;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .scan-cta:hover,
    .scan-cta:focus-visible {
      background: var(--color-accent-hover);
      outline: none;
    }

    .scan-cta:active {
      transform: scale(0.98);
    }

    /* Food log */
    .food-log {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }

    .food-log__header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    .food-log__title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1rem;
      color: var(--color-text);
    }

    .food-log__count {
      font-size: 0.8125rem;
      color: var(--color-text-subtle);
    }

    .food-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }

    .food-item {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      padding: var(--space-md);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
    }

    .food-item__emoji {
      font-size: 1.5rem;
      line-height: 1;
      flex-shrink: 0;
    }

    .food-item__body {
      flex: 1;
      min-width: 0;
    }

    .food-item__name {
      font-weight: 600;
      font-size: 0.9375rem;
      margin-bottom: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .food-item__macros {
      font-size: 0.75rem;
      color: var(--color-text-muted);
    }

    .food-item__right {
      text-align: right;
      flex-shrink: 0;
    }

    .food-item__cal {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.9375rem;
      color: var(--color-accent);
    }

    .food-item__time {
      font-size: 0.6875rem;
      color: var(--color-text-subtle);
      margin-top: 2px;
    }

    .food-log__empty {
      text-align: center;
      padding: var(--space-xl) var(--space-md);
      background: var(--color-surface);
      border: 1px dashed var(--color-border);
      border-radius: var(--radius-md);
      color: var(--color-text-subtle);
      font-size: 0.875rem;
    }

    .food-log__empty-emoji {
      font-size: 2rem;
      display: block;
      margin-bottom: var(--space-sm);
    }

    .page-placeholder {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: var(--space-sm);
      padding: var(--space-xl) var(--space-md);
      color: var(--color-text-subtle);
      font-size: 0.875rem;
    }

    .page-placeholder__title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.125rem;
      color: var(--color-text-muted);
    }

    /* Cards */
    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--space-md);
    }

    .card-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--color-text-muted);
      margin-bottom: var(--space-md);
    }

    /* Chart */
    .chart-wrap {
      position: relative;
      height: 180px;
      width: 100%;
    }

  </style>
</head>
<body>
  <div class="app">
    <nav class="nav" aria-label="Main navigation">
      <div class="nav-top">
        <h1 class="logo">Nutri<span>Lens</span></h1>
        <span class="streak-badge" id="streakBadge" aria-label="Logging streak">🔥 0</span>
      </div>
      <div class="nav-tabs" role="tablist">
        <button type="button" class="nav-tab active" data-page="home" role="tab" aria-selected="true">Home</button>
        <button type="button" class="nav-tab" data-page="scan" role="tab" aria-selected="false">Scan</button>
        <button type="button" class="nav-tab" data-page="weekly" role="tab" aria-selected="false">Weekly</button>
        <button type="button" class="nav-tab" data-page="goals" role="tab" aria-selected="false">Goals</button>
      </div>
    </nav>

    <div id="page-home" class="page active" role="tabpanel">
      <section class="hero" aria-label="Daily dashboard">
        <p class="hero__date" id="heroDate"></p>
        <h2 class="hero__greeting" id="heroGreeting"></h2>

        <div class="hero__ring-wrap">
          <svg id="calRing" class="cal-ring" width="170" height="170" viewBox="0 0 170 170" aria-label="Calorie progress">
            <defs>
              <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#4ade80" />
                <stop offset="100%" stop-color="#22d3ee" />
              </linearGradient>
            </defs>
            <circle cx="85" cy="85" r="68" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="11" />
            <circle
              id="calRingProgress"
              class="cal-ring__progress"
              cx="85"
              cy="85"
              r="68"
              fill="none"
              stroke="url(#ringGradient)"
              stroke-width="11"
              stroke-linecap="round"
              stroke-dasharray="427.3"
              stroke-dashoffset="427.3"
              transform="rotate(-90 85 85)"
            />
            <text x="85" y="78" text-anchor="middle" class="cal-ring__center-value" id="ringCalories">0</text>
            <text x="85" y="96" text-anchor="middle" class="cal-ring__center-label" id="ringGoalLabel">of 2000 kcal</text>
          </svg>
        </div>

        <div class="macro-grid" aria-label="Macro nutrients">
          <div class="macro-card">
            <span class="macro-card__label macro-card__label--protein">Protein</span>
            <div class="macro-card__value"><span id="proteinGrams">0</span>g</div>
            <div class="macro-card__bar">
              <div class="macro-card__bar-fill macro-card__bar-fill--protein" id="proteinBar"></div>
            </div>
          </div>
          <div class="macro-card">
            <span class="macro-card__label macro-card__label--carbs">Carbs</span>
            <div class="macro-card__value"><span id="carbsGrams">0</span>g</div>
            <div class="macro-card__bar">
              <div class="macro-card__bar-fill macro-card__bar-fill--carbs" id="carbsBar"></div>
            </div>
          </div>
          <div class="macro-card">
            <span class="macro-card__label macro-card__label--fat">Fat</span>
            <div class="macro-card__value"><span id="fatGrams">0</span>g</div>
            <div class="macro-card__bar">
              <div class="macro-card__bar-fill macro-card__bar-fill--fat" id="fatBar"></div>
            </div>
          </div>
        </div>
      </section>

      <button type="button" class="scan-cta" onclick="switchPage('scan')">
        Scan Your Meal with AI
      </button>

      <section class="food-log" aria-label="Today's food log">
        <div class="food-log__header">
          <h2 class="food-log__title">Today's Log</h2>
          <span class="food-log__count" id="mealCount">0 meals</span>
        </div>
        <ul class="food-list" id="foodList"></ul>
      </section>
    </div>

    <div id="page-scan" class="page" role="tabpanel">
      <div class="page-placeholder">
        <p class="page-placeholder__title">Scan</p>
        <p>Point your camera at a meal to estimate calories.</p>
      </div>
    </div>

    <div id="page-weekly" class="page" role="tabpanel">
      <section class="card" aria-label="Weekly trend">
        <h2 class="card-title">This week</h2>
        <div class="chart-wrap">
          <canvas id="weekChart"></canvas>
        </div>
      </section>
    </div>

    <div id="page-goals" class="page" role="tabpanel">
      <div class="page-placeholder">
        <p class="page-placeholder__title">Goals</p>
        <p>Set your daily calorie target and macro splits.</p>
      </div>
    </div>

  </div>

  <script>
    const STORAGE_KEY = "nutriLensG";
    const RING_CIRCUMFERENCE = 427.3;

    const defaultState = () => ({
      goals: { calories: 2000, protein: 150, carbs: 250, fat: 65 },
      diary: {},
      streak: 0,
      bestStreak: 0,
      lastLogDate: null,
      weekHistory: {},
    });

    function diaryKey(date = new Date()) {
      return date.toDateString();
    }

    function emptyDiaryDay() {
      return {
        items: [],
        totals: { calories: 0, protein: 0, carbs: 0, fat: 0 },
      };
    }

    function migrateState(parsed) {
      const base = defaultState();
      if (parsed.goals && parsed.diary !== undefined) {
        return {
          ...base,
          ...parsed,
          goals: { ...base.goals, ...parsed.goals },
          diary: parsed.diary || {},
          weekHistory: parsed.weekHistory || {},
        };
      }

      if (parsed.goal) base.goals.calories = parsed.goal;
      if (parsed.streak) base.streak = parsed.streak;

      const meals = parsed.meals || [];
      meals.forEach((m) => {
        const date = m.date ? new Date(m.date + "T12:00:00") : new Date();
        const key = diaryKey(date);
        if (!base.diary[key]) base.diary[key] = emptyDiaryDay();
        const item = {
          id: m.id || crypto.randomUUID(),
          emoji: m.emoji || "🍽️",
          name: m.name || "Meal",
          calories: m.calories || 0,
          protein: m.protein || 0,
          carbs: m.carbs || 0,
          fat: m.fat || 0,
          time: m.time || new Date().toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }),
        };
        base.diary[key].items.push(item);
      });

      Object.keys(base.diary).forEach((key) => recalcDiaryTotals(base.diary[key]));
      syncWeekHistoryFromDiary(base);
      return base;
    }

    function recalcDiaryTotals(day) {
      day.totals = day.items.reduce(
        (acc, item) => ({
          calories: acc.calories + (item.calories || 0),
          protein: acc.protein + (item.protein || 0),
          carbs: acc.carbs + (item.carbs || 0),
          fat: acc.fat + (item.fat || 0),
        }),
        { calories: 0, protein: 0, carbs: 0, fat: 0 }
      );
    }

    function syncWeekHistoryFromDiary(targetState) {
      Object.entries(targetState.diary).forEach(([key, day]) => {
        targetState.weekHistory[key] = day.totals.calories;
      });
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return defaultState();
        return migrateState(JSON.parse(raw));
      } catch {
        return defaultState();
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    let state = loadState();
    let weekChart = null;

    function todayDiary() {
      const key = diaryKey();
      if (!state.diary[key]) {
        state.diary[key] = emptyDiaryDay();
      }
      return state.diary[key];
    }

    function getGreeting() {
      const hour = new Date().getHours();
      if (hour < 12) return "Good Morning 👋";
      if (hour < 17) return "Good Afternoon 👋";
      return "Good Evening 👋";
    }

    function formatHeroDate() {
      return new Date()
        .toLocaleDateString(undefined, {
          weekday: "long",
          month: "short",
          day: "numeric",
        })
        .toUpperCase();
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = String(str ?? "");
      return div.innerHTML;
    }

    function updateCalorieRing(consumed, goal) {
      const progress = document.getElementById("calRingProgress");
      const pct = goal > 0 ? Math.min(consumed / goal, 1) : 0;
      const offset = RING_CIRCUMFERENCE * (1 - pct);
      progress.style.strokeDashoffset = String(offset);

      document.getElementById("ringCalories").textContent = Math.round(consumed);
      document.getElementById("ringGoalLabel").textContent = `of ${goal} kcal`;
    }

    function updateMacroBars(totals) {
      const { goals } = state;
      const macros = [
        { gramsEl: "proteinGrams", barEl: "proteinBar", value: totals.protein, goal: goals.protein },
        { gramsEl: "carbsGrams", barEl: "carbsBar", value: totals.carbs, goal: goals.carbs },
        { gramsEl: "fatGrams", barEl: "fatBar", value: totals.fat, goal: goals.fat },
      ];

      macros.forEach(({ gramsEl, barEl, value, goal }) => {
        document.getElementById(gramsEl).textContent = Math.round(value);
        const pct = goal > 0 ? Math.min((value / goal) * 100, 100) : 0;
        document.getElementById(barEl).style.width = `${pct}%`;
      });
    }

    function renderFoodList() {
      const list = document.getElementById("foodList");
      const diary = todayDiary();
      const items = [...diary.items].reverse();
      const count = items.length;

      document.getElementById("mealCount").textContent =
        count === 1 ? "1 meal" : `${count} meals`;

      if (count === 0) {
        list.innerHTML = `
          <li class="food-log__empty">
            <span class="food-log__empty-emoji" aria-hidden="true">🍽️</span>
            No meals logged yet. Scan your first meal to get started.
          </li>`;
        return;
      }

      list.innerHTML = items
        .map(
          (item) => `
        <li class="food-item">
          <span class="food-item__emoji" aria-hidden="true">${escapeHtml(item.emoji || "🍽️")}</span>
          <div class="food-item__body">
            <p class="food-item__name">${escapeHtml(item.name)}</p>
            <p class="food-item__macros">P ${Math.round(item.protein)}g · C ${Math.round(item.carbs)}g · F ${Math.round(item.fat)}g</p>
          </div>
          <div class="food-item__right">
            <p class="food-item__cal">${Math.round(item.calories)} kcal</p>
            <p class="food-item__time">${escapeHtml(item.time)}</p>
          </div>
        </li>`
        )
        .join("");
    }

    function updateUI() {
      const diary = todayDiary();
      recalcDiaryTotals(diary);
      const { totals } = diary;
      const goal = state.goals.calories;

      state.weekHistory[diaryKey()] = totals.calories;
      saveState();

      document.getElementById("heroDate").textContent = formatHeroDate();
      document.getElementById("heroGreeting").textContent = getGreeting();
      document.getElementById("streakBadge").textContent = `🔥 ${state.streak ?? 0}`;

      updateCalorieRing(totals.calories, goal);
      updateMacroBars(totals);
      renderFoodList();
      refreshWeekChart();
    }

    function switchPage(name) {
      document.querySelectorAll(".page").forEach((page) => {
        page.classList.remove("active");
      });

      const target = document.getElementById(`page-${name}`);
      if (target) {
        target.classList.remove("active");
        void target.offsetWidth;
        target.classList.add("active");
      }

      document.querySelectorAll(".nav-tab").forEach((tab) => {
        const isActive = tab.dataset.page === name;
        tab.classList.toggle("active", isActive);
        tab.setAttribute("aria-selected", isActive ? "true" : "false");
      });
    }

    function getWeekLabels() {
      const labels = [];
      const d = new Date();
      for (let i = 6; i >= 0; i--) {
        const day = new Date(d);
        day.setDate(d.getDate() - i);
        labels.push(
          day.toLocaleDateString(undefined, { weekday: "short" }).slice(0, 2)
        );
      }
      return labels;
    }

    function getWeekCalories() {
      const values = [];
      const d = new Date();
      for (let i = 6; i >= 0; i--) {
        const day = new Date(d);
        day.setDate(d.getDate() - i);
        const key = diaryKey(day);
        if (state.diary[key]) {
          values.push(state.diary[key].totals.calories);
        } else if (state.weekHistory[key] !== undefined) {
          values.push(state.weekHistory[key]);
        } else {
          values.push(0);
        }
      }
      return values;
    }

    function chartColors() {
      return {
        accent: "#4ade80",
        accentDim: "rgba(74, 222, 128, 0.2)",
        grid: "#262626",
        text: "#737373",
      };
    }

    function initWeekChart() {
      const ctx = document.getElementById("weekChart");
      const c = chartColors();

      weekChart = new Chart(ctx, {
        type: "bar",
        data: {
          labels: getWeekLabels(),
          datasets: [
            {
              label: "Calories",
              data: getWeekCalories(),
              backgroundColor: c.accentDim,
              borderColor: c.accent,
              borderWidth: 1,
              borderRadius: 6,
            },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: {
              grid: { display: false },
              ticks: { color: c.text, font: { family: "'DM Sans'" } },
            },
            y: {
              beginAtZero: true,
              grid: { color: c.grid },
              ticks: { color: c.text, font: { family: "'DM Sans'" } },
            },
          },
        },
      });
    }

    function refreshWeekChart() {
      if (!weekChart) return;
      weekChart.data.labels = getWeekLabels();
      weekChart.data.datasets[0].data = getWeekCalories();
      weekChart.update();
    }

    document.querySelectorAll(".nav-tab").forEach((tab) => {
      tab.addEventListener("click", () => switchPage(tab.dataset.page));
    });

    document.addEventListener("DOMContentLoaded", () => {
      todayDiary();
      if (typeof Chart !== "undefined") {
        initWeekChart();
      }
      updateUI();
      switchPage("home");
    });
  </script>
</body>
</html>
